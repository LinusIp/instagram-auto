name: Instagram autopost

on:
  schedule:
    # 3 posts a day: 09:47, 14:47 and 19:47 Tashkent time (times here are UTC = Tashkent - 5h).
    # GitHub may start runs a few minutes late. Once a day example: "47 14 * * *"
    - cron: "47 4,9,14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only: make subtitles + captions for everything in queue/, don't post"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ vars.WHISPER_MODEL || 'small.en' }}

      - run: pip install -r requirements.txt

      - name: Post next item
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WHISPER_MODEL: ${{ vars.WHISPER_MODEL || 'small.en' }}
          POSTS_PER_RUN: ${{ vars.POSTS_PER_RUN || '1' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
        run: |
          git config user.name "autopost-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python autopost.py

      - name: Upload preview (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: out/
          if-no-files-found: ignore
